name: Release

# tag 触发（v*）：构建 4 平台安装包 → 上传 GitHub Release 草稿，
# 人工 sanity check 后 publish（review.md 任务一 1.3.4/1.3.5）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 上传 GitHub Release 需要

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: darwin-arm64 }
          - { os: macos-13,       platform: darwin-amd64 }
          - { os: windows-latest, platform: windows-amd64 }
          - { os: ubuntu-latest,  platform: linux-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev

      - if: runner.os == 'Windows'
        run: choco install nsis -y   # windows:create:nsis:installer 需要 makensis

      # 版本单一来源 build/WAILS_VERSION
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(cat build/WAILS_VERSION)

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Wails package
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          # macOS 公证：未配置 secrets 时跳过（保留 ad-hoc 签名），见 1.3.5
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名：未配置时跳过
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: wails3 package

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: np-${{ matrix.platform }}
          path: |
            bin/*.app
            bin/*.dmg
            bin/*.exe
            bin/*.msi
            bin/*.deb
            bin/*.AppImage
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            np-*/bin/*
          generate_release_notes: true
          draft: true   # 手动检查后再 publish
