<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Nomad Panel</title>
    <script>
      window.onerror = function (msg, src, line, col, err) {
        document.title = 'CRASH: ' + (err?.message || msg || 'unknown')
        return false
      }
      window.addEventListener('unhandledrejection', function (e) {
        document.title = 'REJECT: ' + (e.reason?.message || String(e.reason))
      })
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
