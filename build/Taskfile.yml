version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies (bun)
    dir: frontend
    sources:
      - package.json
      - bun.lock
    generates:
      - node_modules/*
    cmds:
      - bun install

  build:frontend:
    label: build:frontend (PRODUCTION={{.PRODUCTION}})
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    # 必须串行：bun install 写 node_modules 时若并行跑 go mod tidy / bindings，
    # Windows 会因文件锁失败（The process cannot access the file...）。
    cmds:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
      - bun run build
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    # tidy 放 cmds，保证与调用方（build:frontend）串行顺序可控
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - task: go:mod:tidy
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` files from an image
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  dev:frontend:
    summary: Runs the frontend in development mode (bun)
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - bun run dev

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  render:version:
    summary: Replaces __VERSION__ placeholders with the actual version in build assets
    # 包装/发行前把版本号写进 config.yml + 各平台清单（Info.plist / nfpm / NSIS）。
    # 打包完成后用 task common:restore:version 还原占位符（保持 git 干净）。
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - sed -i.bak "s/__VERSION__/{{.VERSION}}/g" build/config.yml build/darwin/Info.plist build/darwin/Info.dev.plist build/windows/nsis/wails_tools.nsh build/linux/nfpm/nfpm.yaml
      - find build -name "*.bak" -delete

  restore:version:
    summary: Restores __VERSION__ placeholders after packaging (git checkout)
    cmds:
      - git checkout -- build/config.yml build/darwin/Info.plist build/darwin/Info.dev.plist build/windows/nsis/wails_tools.nsh build/linux/nfpm/nfpm.yaml

  regen-bindings:
    summary: Regenerates Wails bindings + obfuscated IDs (run after Wails upgrade)
    cmds:
      - wails3 generate bindings -obfuscated ./... -clean=true -ts
      - task: common:strip:obfuscated

  strip:obfuscated:
    summary: Strips the wails_obfuscated build tag (keeps binding IDs stable in plain builds)
    internal: true
    cmds:
      - sed -i '' '/^\/\/go:build wails_obfuscated$/d' wails_obfuscated.gen.go
