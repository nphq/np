version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Creates a build of the application (dev/prod toggled by PRODUCTION var)
    # tidy 与 frontend 不可并行：frontend 内 bun install 会写 node_modules，
    # 与 go mod tidy 争用在 Windows CI 上失败（darwin/linux 偶发）。
    cmds:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
    vars:
      # 生产构建注入版本号（review.md 任务一 1.3.2）；默认 dev。
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X github.com/nphq/np/internal/version.Version={{.VERSION}}"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      VERSION: '{{.VERSION | default "dev"}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build into a `.app` bundle (+ notarize if APPLE_ID set)
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - task: create:app:bundle
      - task: notarize

  # 公证（review.md 1.3.5）：无 APPLE_ID 时跳过（保留 ad-hoc 签名），开发不受影响。
  notarize:
    summary: Codesigns with Developer ID + notarizes the `.app` (skipped when APPLE_ID unset)
    cmds:
      - |
        if [ -z "${APPLE_ID}" ]; then
          echo "skip notarize: APPLE_ID not set"
          exit 0
        fi
        if [ -n "${APPLE_DEVELOPER_ID}" ]; then
          codesign --force --deep --sign "${APPLE_DEVELOPER_ID}" --options runtime {{.BIN_DIR}}/{{.APP_NAME}}.app
        fi
        ditto -c -k --keepParent {{.BIN_DIR}}/{{.APP_NAME}}.app {{.BIN_DIR}}/{{.APP_NAME}}.zip
        xcrun notarytool submit {{.BIN_DIR}}/{{.APP_NAME}}.zip \
          --apple-id "${APPLE_ID}" --password "${APPLE_APP_PASSWORD}" \
          --team-id "${APPLE_TEAM_ID}" --wait
        xcrun stapler staple {{.BIN_DIR}}/{{.APP_NAME}}.app
        rm -f {{.BIN_DIR}}/{{.APP_NAME}}.zip

  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - rm -rf {{.BIN_DIR}}/{{.APP_NAME}}.app
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/{MacOS,Resources}
      # Info.plist CFBundleIconFile=iconfile → 必须是 Resources/iconfile.icns
      - cp build/darwin/icons.icns {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/iconfile.icns
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}
      - cp build/darwin/Info.plist {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist
      - codesign --force --deep --sign - {{.BIN_DIR}}/{{.APP_NAME}}.app

  run:
    summary: Runs the app via a signed .dev.app bundle (so Dock/Finder pick up the icon)
    cmds:
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/{MacOS,Resources}
      - cp build/darwin/icons.icns {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources/iconfile.icns
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}
      - cp build/darwin/Info.dev.plist {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist
      - codesign --force --deep --sign - {{.BIN_DIR}}/{{.APP_NAME}}.dev.app
      - '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}'
