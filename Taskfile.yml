version: '3'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

vars:
  APP_NAME: "np"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5173}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  lint:
    summary: Run Go + frontend lint/format/typecheck (CI-equivalent quality gate)
    cmds:
      - golangci-lint run
      - golangci-lint fmt --diff
      - task: lint:frontend

  lint:frontend:
    dir: frontend
    cmds:
      - bun run lint
      - bun run format:check
      - bun run check

  test:
    summary: Run Go unit tests (excludes frontend/)
    cmds:
      - go test $(go list ./... | grep -v '/frontend/')
