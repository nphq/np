<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Slate gradient background (top-left light → bottom-right dark) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.55" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <!-- Soft top-left highlight for depth -->
    <radialGradient id="gloss" cx="0.35" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Amber gradient for N pointer & cardinal dots -->
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.45" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <!-- Slate gradient for S pointer & intercardinal dots -->
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.5" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <!-- Amber bloom -->
    <filter id="amberBloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feFlood flood-color="#F59E0B" flood-opacity="0.6" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle drop shadow for needle -->
    <filter id="needleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="appClip">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#gloss)"/>

  <g clip-path="url(#appClip)">
    <g transform="translate(512 512)">

      <!-- Outer ring (very subtle) -->
      <circle cx="0" cy="0" r="372" fill="none" stroke="#64748B" stroke-opacity="0.30" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="318" fill="none" stroke="#475569" stroke-opacity="0.22" stroke-width="1"/>

      <!-- Tick marks: 24 every 15°, cardinals longer/amber -->
      <g stroke-linecap="round">
        <!-- Minor ticks (16, every 15° except 45° multiples) -->
        <g stroke="#94A3B8" stroke-opacity="0.32" stroke-width="1.6">
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(15)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(30)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(60)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(75)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(105)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(120)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(150)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(165)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(195)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(210)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(240)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(255)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(285)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(300)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(330)"/>
          <line x1="0" y1="-372" x2="0" y2="-358" transform="rotate(345)"/>
        </g>
        <!-- Intercardinal ticks (4, 45° multiples) -->
        <g stroke="#CBD5E1" stroke-opacity="0.55" stroke-width="2.2">
          <line x1="0" y1="-378" x2="0" y2="-358" transform="rotate(45)"/>
          <line x1="0" y1="-378" x2="0" y2="-358" transform="rotate(135)"/>
          <line x1="0" y1="-378" x2="0" y2="-358" transform="rotate(225)"/>
          <line x1="0" y1="-378" x2="0" y2="-358" transform="rotate(315)"/>
        </g>
      </g>

      <!-- Intercardinal node dots (cooler, smaller) -->
      <g fill="url(#slate)" opacity="0.92">
        <circle cx="226.27" cy="-226.27" r="13"/>
        <circle cx="-226.27" cy="-226.27" r="13"/>
        <circle cx="226.27" cy="226.27" r="13"/>
        <circle cx="-226.27" cy="226.27" r="13"/>
      </g>

      <!-- Cardinal node dots (amber, with bloom) -->
      <g filter="url(#amberBloom)">
        <circle cx="0" cy="-318" r="22" fill="url(#amber)"/>
        <circle cx="318" cy="0" r="22" fill="url(#amber)"/>
        <circle cx="0" cy="318" r="22" fill="url(#amber)"/>
        <circle cx="-318" cy="0" r="22" fill="url(#amber)"/>
      </g>

      <!-- Compass needle: amber N (tall) + slate S (shorter) -->
      <g filter="url(#needleShadow)">
        <polygon points="0,-238 26,-22 0,0 -26,-22" fill="url(#amber)"/>
        <polygon points="0,184 20,22 0,0 -20,22" fill="url(#slate)"/>
      </g>

      <!-- Center hub -->
      <circle cx="0" cy="0" r="17" fill="#FDE68A"/>
      <circle cx="0" cy="0" r="9" fill="#92400E"/>
      <circle cx="-3" cy="-3" r="3" fill="#FEF3C7" opacity="0.85"/>

    </g>
  </g>
</svg>
