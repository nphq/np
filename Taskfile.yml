version: '3'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "np"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5173}}'
  # 版本号单一来源（review.md 任务一）：默认 dev；CI/本地打包时从 git tag
  # 或命令行传入（VERSION=vX.Y.Z wails3 package）。渲染进 build 资产与
  # -ldflags 的 -X ...version.Version。
  VERSION: '{{.VERSION | default "dev"}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      # 先渲染 __VERSION__ 占位符（config.yml/plists/nfpm/nsh），
      # 再走平台 package（内部 ldflags 注入同一 VERSION）。
      - task: common:render:version
        vars:
          VERSION: '{{.VERSION}}'
      - task: "{{OS}}:package"
        vars:
          VERSION: '{{.VERSION}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  lint:
    summary: Run Go + frontend lint/format/typecheck (CI-equivalent quality gate)
    cmds:
      - golangci-lint run
      - golangci-lint fmt --diff
      - task: lint:frontend

  lint:frontend:
    dir: frontend
    cmds:
      - bun run lint
      - bun run format:check
      - bun run check

  test:
    summary: Run Go unit tests with -race (excludes frontend/)
    cmds:
      - go test -race $(go list ./... | grep -v '/frontend/')
