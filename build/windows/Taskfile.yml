version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    # icons 与 Go/前端无共享文件锁，可并行；tidy 必须在 frontend 之前完成，
    # 且 frontend 内部 install→bindings 也已串行（见 common:build:frontend）。
    deps:
      - task: common:generate:icons
    cmds:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}.exe
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      # 生产构建注入版本号（review.md 任务一 1.3.2）；默认 dev。
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X github.com/nphq/np/internal/version.Version={{.VERSION}}"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      VERSION: '{{.VERSION | default "dev"}}'
    env:
      GOOS: windows
      # Windows WebView2 不需要 CGO；便于在非 Windows 主机交叉编译 .exe
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production Windows build into an NSIS installer
    cmds:
      - task: create:nsis:installer
        vars:
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION | default "dev"}}'

  # 签名（review.md 1.3.5）：WINDOWS_CERT_PFX 未配置时跳过，不影响开发/CI。
  sign:
    summary: Signs bin/np.exe with signtool + PFX (skipped when WINDOWS_CERT_PFX unset)
    platforms: [windows]
    cmds:
      - 'powershell -Command "if (-not $env:WINDOWS_CERT_PFX) { Write-Host ''skip sign: WINDOWS_CERT_PFX not set''; exit 0 }; $env:WINDOWS_CERT_PFX | Out-File -Encoding ASCII cert.pfx; signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 ''bin\np.exe''; Remove-Item cert.pfx"'

  generate:syso:
    summary: Generates Windows `.syso` file (icon + version info + manifest)
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer (requires makensis)
    dir: build/windows/nsis
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - task: sign
        vars:
          VERSION: '{{.VERSION}}'
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq (.ARCH | default ARCH) "amd64"}}AMD64{{else}}ARM64{{end}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
