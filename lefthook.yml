# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      root: frontend/
      glob: "frontend/**/*.{js,ts,svelte,css,json,html,md}"
      exclude:
        - frontend/bindings/**
        - frontend/node_modules/**
        - frontend/dist/**
      run: bun prettier --write {staged_files}
      stage_fixed: true

    - name: eslint
      root: frontend/
      glob: "frontend/**/*.{js,ts,svelte}"
      exclude:
        - frontend/bindings/**
        - frontend/node_modules/**
        - frontend/dist/**
      run: bun eslint --fix {staged_files}
      stage_fixed: true

    - name: golangci-fmt
      glob: "*.go"
      exclude:
        - "**/*.gen.go"
        - "frontend/**"
      run: golangci-lint fmt
      stage_fixed: true

    - name: golangci-lint
      glob: "*.go"
      exclude:
        - "**/*.gen.go"
        - "frontend/**"
      run: golangci-lint run
