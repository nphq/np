version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux (requires CGO + GTK4/WebKitGTK)
    # icons/desktop 可并行；tidy/frontend 串行（见 common:build:frontend）
    deps:
      - task: common:generate:icons
      - task: generate:dotdesktop
    cmds:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      # 生产构建注入版本号（review.md 任务一 1.3.2）；默认 dev。
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X github.com/nphq/np/internal/version.Version={{.VERSION}}"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      VERSION: '{{.VERSION | default "dev"}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages production Linux builds (AppImage + deb + rpm + AUR)
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - task: create:appimage
        vars:
          VERSION: '{{.VERSION | default "dev"}}'
      - task: create:deb
        vars:
          VERSION: '{{.VERSION | default "dev"}}'
      - task: create:rpm
        vars:
          VERSION: '{{.VERSION | default "dev"}}'
      - task: create:aur
        vars:
          VERSION: '{{.VERSION | default "dev"}}'

  create:appimage:
    summary: Creates an AppImage
    dir: build/linux/appimage
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION | default "dev"}}'
      - task: generate:dotdesktop
    cmds:
      - cp {{.APP_BINARY}} {{.APP_NAME}}
      - cp ../../appicon.png appicon.png
      - wails3 generate appimage -binary {{.APP_NAME}} -icon {{.ICON}} -desktopfile {{.DESKTOP_FILE}} -outputdir {{.OUTPUT_DIR}} -builddir {{.ROOT_DIR}}/build/linux/appimage/build
    vars:
      APP_NAME: '{{.APP_NAME}}'
      APP_BINARY: '../../../bin/{{.APP_NAME}}'
      ICON: '../../appicon.png'
      DESKTOP_FILE: '../{{.APP_NAME}}.desktop'
      OUTPUT_DIR: '../../../bin'

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - task: generate:dotdesktop
      - task: generate:deb

  create:rpm:
    summary: Creates a rpm package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - task: generate:dotdesktop
      - task: generate:rpm

  create:aur:
    summary: Creates an Arch Linux package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - task: generate:dotdesktop
      - task: generate:aur

  generate:deb:
    summary: Creates a deb package via nfpm
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:rpm:
    summary: Creates a rpm package via nfpm
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format rpm -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:aur:
    summary: Creates an Arch Linux package via nfpm
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format archlinux -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    dir: build
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/linux/appimage
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop -categories "{{.CATEGORIES}}"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: 'appicon'
      CATEGORIES: 'System;Monitor;'
      OUTPUTFILE: '{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
